phase: pretrain
model:
  vocab_size: 256
  latent_dim: 128
  action_dim: 64
  max_loops: 1
training:
  max_steps: 2000
  batch_size: 4
  learning_rate: 0.001
  max_seq_len: 128
  grad_accum: 2
  weight_decay: 0.01
  clip_grad_norm: 1.0
  precision: fp32
  log_every: 20
  save_every: 200
  seed: 42
paths:
  data_path: data/raw/pretrain.txt
  output_dir: checkpoints/pretrain
