phase: dpo
model:
  vocab_size: 256
  latent_dim: 128
  action_dim: 64
  max_loops: 2
training:
  max_steps: 200
  batch_size: 1
  learning_rate: 0.00005
  max_seq_len: 128
  beta: 0.1
  weight_decay: 0.0
  clip_grad_norm: 1.0
  log_every: 10
  save_every: 50
paths:
  data_path: data/raw/dpo_grok.jsonl
  output_dir: checkpoints/dpo_grok
