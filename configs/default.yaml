# CEM — AERIS-shaped config (model remains transformer-free CEM)

phase: pretrain

model:
  vocab_size: 256
  latent_dim: 128
  action_dim: 64
  max_loops: 2
  dropout: 0.1

training:
  batch_size: 4
  grad_accum: 4
  max_seq_len: 128
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 10000
  clip_grad_norm: 1.0
  device: auto
  seed: 42
  log_every: 50
  eval_every: 500
  save_every: 500
  precision: fp32
  output_dir: runs/cem_default

data:
  train_path: data/raw/pretrain.txt
  val_path: null

paths:
  data_path: data/raw/pretrain.txt
  output_dir: runs/cem_default
